<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>llm-memory — Local Explorer</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh;
    }
    header {
      display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--accent); }
    #stats { font-size: 0.85rem; color: var(--muted); margin-left: auto; }
    main { display: grid; grid-template-columns: 240px 1fr 420px; flex: 1; min-height: 0; }
    aside, section { border-right: 1px solid var(--border); overflow-y: auto; padding: 1rem; }
    section:last-child { border-right: none; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.75rem; }
    .ns-item {
      display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0.6rem;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-bottom: 0.25rem;
    }
    .ns-item:hover { background: rgba(56, 189, 248, 0.1); }
    .ns-item.active { background: rgba(56, 189, 248, 0.2); color: var(--accent); font-weight: 600; }
    .badge {
      font-size: 0.75rem; padding: 0.1rem 0.45rem; border-radius: 999px;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    }
    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    input, select, button {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.45rem 0.7rem; font-size: 0.88rem;
    }
    input[type="search"] { flex: 1; min-width: 180px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.danger { border-color: var(--red); color: var(--red); }
    button.ok { border-color: var(--green); color: var(--green); }
    .mem-card {
      padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 0.6rem; cursor: pointer; background: rgba(30, 41, 59, 0.5);
    }
    .mem-card:hover, .mem-card.active { border-color: var(--accent); }
    .mem-meta { display: flex; gap: 0.4rem; align-items: center; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; flex-wrap: wrap; }
    .kind { color: var(--accent); font-weight: 600; }
    .imp-3 { color: var(--amber); font-weight: 600; }
    .archived-tag { color: var(--red); }
    .mem-title { font-weight: 600; margin-bottom: 0.25rem; }
    .mem-preview { font-size: 0.86rem; color: #cbd5e1; white-space: pre-wrap; max-height: 4.5em; overflow: hidden; }
    .detail-content { white-space: pre-wrap; background: var(--panel); padding: 0.85rem; border-radius: 8px; border: 1px solid var(--border); font-size: 0.9rem; line-height: 1.45; }
    .hist-item { border-left: 2px solid var(--border); padding-left: 0.75rem; margin-bottom: 0.75rem; font-size: 0.82rem; }
    .hist-meta { color: var(--muted); margin-bottom: 0.2rem; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } aside, section { border-right: none; border-bottom: 1px solid var(--border); } }
  </style>
</head>
<body>
  <header>
    <h1>llm-memory</h1>
    <div id="stats">Loading…</div>
  </header>
  <main>
    <aside>
      <h2>Namespaces</h2>
      <div id="ns-list"></div>
    </aside>
    <section>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search memories (FTS / semantic)…" />
        <select id="kind">
          <option value="">All kinds</option>
          <option value="handoff">handoff</option>
          <option value="decision">decision</option>
          <option value="preference">preference</option>
          <option value="fact">fact</option>
          <option value="task_state">task_state</option>
          <option value="note">note</option>
        </select>
        <select id="archived">
          <option value="active">Active</option>
          <option value="archived">Archived</option>
          <option value="all">All</option>
        </select>
      </div>
      <div id="mem-list"></div>
    </section>
    <section id="detail">
      <h2>Details</h2>
      <p style="color: var(--muted); font-size: 0.9rem;">Select a memory to inspect its content and history.</p>
    </section>
  </main>
  <script>
    const state = { ns: "", selectedId: null };
    const $ = (id) => document.getElementById(id);

    async function api(url, opts) {
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function loadStats() {
      const st = await api("/api/stats");
      $("stats").textContent = `${st.active} active · ${st.archived} archived · schema v${st.schema_version}`;
    }

    async function loadNamespaces() {
      const list = await api("/api/namespaces");
      const el = $("ns-list");
      const allBtn = `<div class="ns-item ${state.ns === "" ? "active" : ""}" data-ns=""><span>All namespaces</span></div>`;
      el.innerHTML = allBtn + list.map((n) =>
        `<div class="ns-item ${state.ns === n.name ? "active" : ""}" data-ns="${esc(n.name)}">
          <span>${esc(n.name)}</span>
          <span class="badge">${n.active_count}</span>
        </div>`
      ).join("");
      el.querySelectorAll(".ns-item").forEach((node) => {
        node.onclick = () => { state.ns = node.dataset.ns; loadNamespaces(); loadMemories(); };
      });
    }

    async function loadMemories() {
      const q = $("q").value.trim();
      const kind = $("kind").value;
      const archived = $("archived").value;
      const params = new URLSearchParams();
      if (state.ns) params.set("namespace", state.ns);
      if (kind) params.set("kind", kind);
      if (archived) params.set("archived", archived);

      let items = [];
      if (q) {
        params.set("q", q);
        const res = await api("/api/search?" + params.toString());
        items = res.map((r) => r.memory);
      } else {
        items = await api("/api/memories?" + params.toString());
      }
      const el = $("mem-list");
      if (!items.length) {
        el.innerHTML = `<p style="color: var(--muted);">No memories match the current filter.</p>`;
        return;
      }
      el.innerHTML = items.map((m) => `
        <div class="mem-card ${state.selectedId === m.id ? "active" : ""}" data-id="${m.id}">
          <div class="mem-meta">
            <span>#${m.id}</span>
            <span class="kind">${esc(m.kind)}</span>
            <span>${esc(m.namespace)}</span>
            <span class="imp-${m.importance}">imp:${m.importance}</span>
            ${m.archived_at ? `<span class="archived-tag">archived</span>` : ""}
            ${m.expires_at ? `<span>ttl:${esc(m.expires_at.slice(0, 10))}</span>` : ""}
          </div>
          ${m.title ? `<div class="mem-title">${esc(m.title)}</div>` : ""}
          <div class="mem-preview">${esc(m.content)}</div>
        </div>
      `).join("");
      el.querySelectorAll(".mem-card").forEach((node) => {
        node.onclick = () => loadDetail(Number(node.dataset.id));
      });
    }

    async function loadDetail(id) {
      state.selectedId = id;
      const { memory: m, history } = await api(`/api/memories/${id}`);
      const tags = (m.tags || []).map((t) => `<span class="badge">#${esc(t)}</span>`).join(" ");
      const actionBtn = m.archived_at
        ? `<button class="ok" id="btn-restore">Restore</button>`
        : `<button class="danger" id="btn-archive">Archive</button>`;
      $("detail").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
          <h2 style="margin:0;">Memory #${m.id}</h2>
          ${actionBtn}
        </div>
        <div class="mem-meta">
          <span class="kind">${esc(m.kind)}</span>
          <span>${esc(m.namespace)}</span>
          <span>by ${esc(m.updated_by)}</span>
          <span>imp:${m.importance}</span>
        </div>
        ${m.title ? `<div class="mem-title" style="font-size:1rem;">${esc(m.title)}</div>` : ""}
        <div style="margin-bottom:0.6rem;">${tags}</div>
        <div class="detail-content">${esc(m.content)}</div>
        <h2 style="margin-top:1.25rem;">History (${history.length})</h2>
        <div>${history.map((h) => `
          <div class="hist-item">
            <div class="hist-meta"><strong>${esc(h.action)}</strong> · ${esc(h.changed_at)} · ${esc(h.changed_by)}</div>
            <div>${esc(h.snapshot)}</div>
          </div>
        `).join("")}</div>
      `;
      if ($("btn-archive")) {
        $("btn-archive").onclick = async () => {
          await api(`/api/memories/${id}/archive`, { method: "POST" });
          await refresh(id);
        };
      }
      if ($("btn-restore")) {
        $("btn-restore").onclick = async () => {
          await api(`/api/memories/${id}/restore`, { method: "POST" });
          await refresh(id);
        };
      }
      loadMemories();
    }

    async function refresh(id) {
      await Promise.all([loadStats(), loadNamespaces(), loadMemories()]);
      if (id) await loadDetail(id);
    }

    let searchTimer;
    $("q").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadMemories, 200); };
    $("kind").onchange = loadMemories;
    $("archived").onchange = loadMemories;
    refresh();
  </script>
</body>
</html>
