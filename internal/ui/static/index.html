<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>llm-memory — Local Explorer</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh;
    }
    header {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--accent); }
    #stats { font-size: 0.85rem; color: var(--muted); margin-left: auto; }
    main { display: grid; grid-template-columns: 220px 1fr 460px; flex: 1; min-height: 0; }
    aside, section { border-right: 1px solid var(--border); overflow-y: auto; padding: 1rem; }
    section:last-child { border-right: none; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 0.75rem; }
    .ns-item {
      display: flex; justify-content: space-between; align-items: center; padding: 0.45rem 0.6rem;
      border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-bottom: 0.25rem;
    }
    .ns-item:hover { background: rgba(56, 189, 248, 0.1); }
    .ns-item.active { background: rgba(56, 189, 248, 0.2); color: var(--accent); font-weight: 600; }
    .badge {
      font-size: 0.75rem; padding: 0.1rem 0.45rem; border-radius: 999px;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border);
    }
    .toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
    input, select, button, textarea {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.45rem 0.7rem; font-size: 0.88rem; font-family: inherit;
    }
    textarea { width: 100%; min-height: 110px; resize: vertical; line-height: 1.4; }
    input[type="search"] { flex: 1; min-width: 180px; }
    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button.danger { border-color: var(--red); color: var(--red); }
    button.ok { border-color: var(--green); color: var(--green); }
    button.sm { padding: 0.25rem 0.55rem; font-size: 0.78rem; }
    .mem-card {
      padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 0.6rem; cursor: pointer; background: rgba(30, 41, 59, 0.5);
    }
    .mem-card:hover, .mem-card.active { border-color: var(--accent); }
    .mem-meta { display: flex; gap: 0.4rem; align-items: center; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem; flex-wrap: wrap; }
    .kind { color: var(--accent); font-weight: 600; }
    .imp-3 { color: var(--amber); font-weight: 600; }
    .archived-tag { color: var(--red); }
    .mem-title { font-weight: 600; margin-bottom: 0.25rem; }
    .mem-preview { font-size: 0.86rem; color: #cbd5e1; white-space: pre-wrap; max-height: 4.5em; overflow: hidden; }
    .detail-content { white-space: pre-wrap; background: var(--panel); padding: 0.85rem; border-radius: 8px; border: 1px solid var(--border); font-size: 0.9rem; line-height: 1.45; }
    .hist-item { border-left: 2px solid var(--border); padding-left: 0.75rem; margin-bottom: 0.75rem; font-size: 0.82rem; }
    .hist-meta { color: var(--muted); margin-bottom: 0.2rem; }
    .diff-box { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.45rem 0.6rem; white-space: pre-wrap; }
    .diff-add { color: var(--green); display: block; }
    .diff-del { color: var(--red); display: block; }
    .diff-ctx { color: var(--muted); display: block; }
    .form-grid { display: flex; flex-direction: column; gap: 0.6rem; background: var(--panel); padding: 0.85rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 1rem; }
    .form-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .form-row > * { flex: 1; min-width: 100px; }
    .banner { padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.84rem; margin-bottom: 0.75rem; border: 1px solid var(--border); background: var(--panel); }
    .banner.err { border-color: var(--red); color: var(--red); }
    .banner.ok { border-color: var(--green); color: var(--green); }
    .sim-card { padding: 0.55rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.45rem; background: var(--bg); font-size: 0.82rem; }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; } aside, section { border-right: none; border-bottom: 1px solid var(--border); } }
  </style>
</head>
<body>
  <header>
    <h1>llm-memory</h1>
    <button class="primary sm" id="btn-new">+ New</button>
    <button class="sm" id="btn-gc" title="Archive expired TTL memories">Run GC</button>
    <div id="stats">Loading…</div>
  </header>
  <main>
    <aside>
      <h2>Namespaces</h2>
      <div id="ns-list"></div>
    </aside>
    <section>
      <div id="status-banner" style="display:none;"></div>
      <div id="create-box" style="display:none;"></div>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search memories (FTS / semantic)…" />
        <select id="kind">
          <option value="">All kinds</option>
          <option value="handoff">handoff</option>
          <option value="decision">decision</option>
          <option value="preference">preference</option>
          <option value="fact">fact</option>
          <option value="task_state">task_state</option>
          <option value="note">note</option>
        </select>
        <select id="archived">
          <option value="active">Active</option>
          <option value="archived">Archived</option>
          <option value="all">All</option>
        </select>
      </div>
      <div id="mem-list"></div>
    </section>
    <section id="detail">
      <h2>Details</h2>
      <p style="color: var(--muted); font-size: 0.9rem;">Select a memory to inspect its content, diff history, and similar memories.</p>
    </section>
  </main>
  <script>
    const state = { ns: "", selectedId: null, diffMode: true };
    const $ = (id) => document.getElementById(id);

    async function api(url, opts) {
      const res = await fetch(url, opts);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function showBanner(msg, isErr) {
      const el = $("status-banner");
      el.className = "banner " + (isErr ? "err" : "ok");
      el.textContent = msg;
      el.style.display = "block";
      if (!isErr) setTimeout(() => { el.style.display = "none"; }, 4000);
    }

    function lineDiff(oldText, newText) {
      const a = String(oldText ?? "").split("\n");
      const b = String(newText ?? "").split("\n");
      const m = a.length, n = b.length;
      if (m * n > 250000) {
        return `<div class="diff-box">${a.map((l) => `<span class="diff-del">- ${esc(l)}</span>`).join("")}${b.map((l) => `<span class="diff-add">+ ${esc(l)}</span>`).join("")}</div>`;
      }
      const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
      for (let i = m - 1; i >= 0; i--) {
        for (let j = n - 1; j >= 0; j--) {
          dp[i][j] = a[i] === b[j] ? 1 + dp[i + 1][j + 1] : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
      const lines = [];
      let i = 0, j = 0;
      while (i < m && j < n) {
        if (a[i] === b[j]) {
          lines.push(`<span class="diff-ctx">  ${esc(a[i])}</span>`);
          i++; j++;
        } else if (dp[i + 1][j] >= dp[i][j + 1]) {
          lines.push(`<span class="diff-del">- ${esc(a[i])}</span>`);
          i++;
        } else {
          lines.push(`<span class="diff-add">+ ${esc(b[j])}</span>`);
          j++;
        }
      }
      while (i < m) lines.push(`<span class="diff-del">- ${esc(a[i++])}</span>`);
      while (j < n) lines.push(`<span class="diff-add">+ ${esc(b[j++])}</span>`);
      return `<div class="diff-box">${lines.join("")}</div>`;
    }

    async function loadStats() {
      const st = await api("/api/stats");
      $("stats").textContent = `${st.active} active · ${st.archived} archived · schema v${st.schema_version}`;
    }

    async function loadNamespaces() {
      const list = await api("/api/namespaces");
      const el = $("ns-list");
      const allBtn = `<div class="ns-item ${state.ns === "" ? "active" : ""}" data-ns=""><span>All namespaces</span></div>`;
      el.innerHTML = allBtn + list.map((n) =>
        `<div class="ns-item ${state.ns === n.name ? "active" : ""}" data-ns="${esc(n.name)}">
          <span>${esc(n.name)}</span>
          <span class="badge">${n.active_count}</span>
        </div>`
      ).join("");
      el.querySelectorAll(".ns-item").forEach((node) => {
        node.onclick = () => { state.ns = node.dataset.ns; loadNamespaces(); loadMemories(); };
      });
    }

    async function loadMemories() {
      const q = $("q").value.trim();
      const kind = $("kind").value;
      const archived = $("archived").value;
      const params = new URLSearchParams();
      if (state.ns) params.set("namespace", state.ns);
      if (kind) params.set("kind", kind);
      if (archived) params.set("archived", archived);

      let items = [];
      if (q) {
        params.set("q", q);
        const res = await api("/api/search?" + params.toString());
        items = res.map((r) => r.memory);
      } else {
        items = await api("/api/memories?" + params.toString());
      }
      const el = $("mem-list");
      if (!items.length) {
        el.innerHTML = `<p style="color: var(--muted);">No memories match the current filter.</p>`;
        return;
      }
      el.innerHTML = items.map((m) => `
        <div class="mem-card ${state.selectedId === m.id ? "active" : ""}" data-id="${m.id}">
          <div class="mem-meta">
            <span>#${m.id}</span>
            <span class="kind">${esc(m.kind)}</span>
            <span>${esc(m.namespace)}</span>
            <span class="imp-${m.importance}">imp:${m.importance}</span>
            ${m.archived_at ? `<span class="archived-tag">archived</span>` : ""}
            ${m.expires_at ? `<span>ttl:${esc(m.expires_at.slice(0, 10))}</span>` : ""}
          </div>
          ${m.title ? `<div class="mem-title">${esc(m.title)}</div>` : ""}
          <div class="mem-preview">${esc(m.content)}</div>
        </div>
      `).join("");
      el.querySelectorAll(".mem-card").forEach((node) => {
        node.onclick = () => loadDetail(Number(node.dataset.id));
      });
    }

    function openCreateForm() {
      const box = $("create-box");
      if (box.style.display === "block") { box.style.display = "none"; return; }
      box.style.display = "block";
      box.innerHTML = `
        <div class="form-grid">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong>New memory</strong>
            <button class="sm" id="c-cancel">Close</button>
          </div>
          <div class="form-row">
            <input id="c-ns" placeholder="namespace (default global)" value="${esc(state.ns || "global")}" />
            <select id="c-kind">
              <option value="fact">fact</option>
              <option value="decision">decision</option>
              <option value="preference">preference</option>
              <option value="task_state">task_state</option>
              <option value="note">note</option>
            </select>
            <select id="c-imp">
              <option value="2">importance 2</option>
              <option value="3">importance 3</option>
              <option value="1">importance 1</option>
            </select>
          </div>
          <input id="c-title" placeholder="Title (optional)" />
          <input id="c-tags" placeholder="Tags comma-separated (optional)" />
          <textarea id="c-content" placeholder="Memory content…"></textarea>
          <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
            <button class="primary" id="c-save">Create</button>
          </div>
        </div>
      `;
      $("c-cancel").onclick = () => { box.style.display = "none"; };
      $("c-save").onclick = async () => {
        try {
          const tags = $("c-tags").value.split(",").map((t) => t.trim()).filter(Boolean);
          const created = await api("/api/memories", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              namespace: $("c-ns").value.trim() || "global",
              kind: $("c-kind").value,
              importance: Number($("c-imp").value),
              title: $("c-title").value.trim(),
              tags,
              content: $("c-content").value,
            }),
          });
          box.style.display = "none";
          showBanner(`Created memory #${created.id}`, false);
          await refresh(created.id);
        } catch (err) {
          showBanner(err.message, true);
        }
      };
    }

    async function loadDetail(id, editMode = false) {
      state.selectedId = id;
      const { memory: m, history } = await api(`/api/memories/${id}`);
      const tags = (m.tags || []).map((t) => `<span class="badge">#${esc(t)}</span>`).join(" ");
      const actionBtn = m.archived_at
        ? `<button class="ok sm" id="btn-restore">Restore</button>`
        : `<button class="sm" id="btn-edit">Edit</button>
           <button class="sm" id="btn-similar">Find Similar</button>
           <button class="danger sm" id="btn-archive">Archive</button>`;

      const bodyHTML = editMode ? `
        <div class="form-grid" style="margin-top:0.5rem;">
          <div class="form-row">
            <select id="e-kind">
              ${["fact","decision","preference","task_state","note"].map((k) => `<option value="${k}" ${m.kind === k ? "selected" : ""}>${k}</option>`).join("")}
            </select>
            <select id="e-imp">
              ${[1,2,3].map((v) => `<option value="${v}" ${m.importance === v ? "selected" : ""}>importance ${v}</option>`).join("")}
            </select>
          </div>
          <input id="e-title" value="${esc(m.title)}" placeholder="Title" />
          <input id="e-tags" value="${esc((m.tags || []).join(", "))}" placeholder="Tags comma-separated" />
          <textarea id="e-content">${esc(m.content)}</textarea>
          <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
            <button class="sm" id="e-cancel">Cancel</button>
            <button class="primary sm" id="e-save">Save</button>
          </div>
        </div>
      ` : `
        ${m.title ? `<div class="mem-title" style="font-size:1rem;">${esc(m.title)}</div>` : ""}
        <div style="margin-bottom:0.6rem;">${tags}</div>
        <div class="detail-content">${esc(m.content)}</div>
      `;

      const histHTML = history.map((h, idx) => {
        let body = `<div>${esc(h.snapshot)}</div>`;
        if (state.diffMode) {
          const prev = idx === 0 ? "" : history[idx - 1].snapshot;
          body = lineDiff(prev, h.snapshot);
        }
        return `
          <div class="hist-item">
            <div class="hist-meta"><strong>${esc(h.action)}</strong> · ${esc(h.changed_at)} · ${esc(h.changed_by)}</div>
            ${body}
          </div>
        `;
      }).join("");

      $("detail").innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem; margin-bottom:0.75rem; flex-wrap:wrap;">
          <h2 style="margin:0;">Memory #${m.id}</h2>
          <div style="display:flex; gap:0.35rem; flex-wrap:wrap;">${actionBtn}</div>
        </div>
        <div class="mem-meta">
          <span class="kind">${esc(m.kind)}</span>
          <span>${esc(m.namespace)}</span>
          <span>by ${esc(m.updated_by)}</span>
          <span>imp:${m.importance}</span>
        </div>
        ${bodyHTML}
        <div id="similar-box" style="margin-top:1rem;"></div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:1.25rem; margin-bottom:0.5rem;">
          <h2 style="margin:0;">History (${history.length})</h2>
          <button class="sm" id="btn-diff-toggle">${state.diffMode ? "Show Raw" : "Show Diff"}</button>
        </div>
        <div>${histHTML}</div>
      `;

      if ($("btn-edit")) $("btn-edit").onclick = () => loadDetail(id, true);
      if ($("e-cancel")) $("e-cancel").onclick = () => loadDetail(id, false);
      if ($("e-save")) {
        $("e-save").onclick = async () => {
          try {
            const tags = $("e-tags").value.split(",").map((t) => t.trim()).filter(Boolean);
            await api(`/api/memories/${id}`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                kind: $("e-kind").value,
                importance: Number($("e-imp").value),
                title: $("e-title").value,
                tags,
                content: $("e-content").value,
              }),
            });
            showBanner(`Updated memory #${id}`, false);
            await refresh(id);
          } catch (err) {
            showBanner(err.message, true);
          }
        };
      }
      if ($("btn-similar")) {
        $("btn-similar").onclick = async () => {
          const box = $("similar-box");
          box.innerHTML = `<span style="color:var(--muted); font-size:0.82rem;">Searching similar memories…</span>`;
          try {
            const sims = await api(`/api/memories/${id}/similar`);
            if (!sims.length) {
              box.innerHTML = `<span style="color:var(--muted); font-size:0.82rem;">No similar memories found in ${esc(m.namespace)}.</span>`;
              return;
            }
            box.innerHTML = `<h2>Similar in ${esc(m.namespace)} (${sims.length})</h2>` + sims.map((r) => `
              <div class="sim-card">
                <div class="mem-meta" style="justify-content:space-between;">
                  <span>#${r.id} · ${esc(r.kind)} · ${(r.similarity * 100).toFixed(0)}% match</span>
                  <button class="danger sm btn-supersede" data-target="${r.id}">Supersede #${r.id}</button>
                </div>
                ${r.title ? `<div class="mem-title">${esc(r.title)}</div>` : ""}
                <div class="mem-preview">${esc(r.snippet)}</div>
              </div>
            `).join("");
            box.querySelectorAll(".btn-supersede").forEach((btn) => {
              btn.onclick = async () => {
                const targetId = Number(btn.dataset.target);
                await api(`/api/memories/${id}/supersede`, {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ target_id: targetId }),
                });
                showBanner(`Archived #${targetId} (superseded by #${id})`, false);
                await refresh(id);
              };
            });
          } catch (err) {
            showBanner(err.message, true);
          }
        };
      }
      if ($("btn-diff-toggle")) {
        $("btn-diff-toggle").onclick = () => { state.diffMode = !state.diffMode; loadDetail(id, editMode); };
      }
      if ($("btn-archive")) {
        $("btn-archive").onclick = async () => {
          await api(`/api/memories/${id}/archive`, { method: "POST" });
          await refresh(id);
        };
      }
      if ($("btn-restore")) {
        $("btn-restore").onclick = async () => {
          await api(`/api/memories/${id}/restore`, { method: "POST" });
          await refresh(id);
        };
      }
      loadMemories();
    }

    async function refresh(id) {
      await Promise.all([loadStats(), loadNamespaces(), loadMemories()]);
      if (id) await loadDetail(id);
    }

    $("btn-new").onclick = openCreateForm;
    $("btn-gc").onclick = async () => {
      const res = await api("/api/gc", { method: "POST" });
      showBanner(`GC archived ${res.archived} expired memory(ies)`, false);
      await refresh(state.selectedId);
    };

    let searchTimer;
    $("q").oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadMemories, 200); };
    $("kind").onchange = loadMemories;
    $("archived").onchange = loadMemories;
    refresh();
  </script>
</body>
</html>
